[project]
name = "wipplank"
version = "0.1.0"
description = "Awesome fun CLI for email + IA access"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Wipplank contributors" }]
keywords = ["email", "imap", "cli", "tui", "mcp"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "keyring>=25",
]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2",
  "google-auth-oauthlib>=1",
]
mcp = [
  "fastmcp>=2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
]
tui = [
    "textual>=3",
]
openpgp = [
    "python-gnupg>=0.5",
]

[project.scripts]
wipplank = "wipplank.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wipplank"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: needs real credentials + network (runs only with WIPPLANK_LIVE=1)",
  "slow: needs gpg key generation",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]
